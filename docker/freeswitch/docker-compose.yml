# Real-time FreeSWITCH <-> Pipecat demo.
#
# FreeSWITCH (drachtio prebuilt MRF image, FreeSWITCH 1.10.x) with mod_audio_fork
# (drachtio's MIT module, compiled INTO this image — no concurrency cap, replaces
# amigniter's license-limited mod_audio_stream) streams the caller's audio to the
# Pipecat bot on the HOST over a WebSocket and plays the bot's TTS back into the call.
#
#   docker compose -f docker/freeswitch/docker-compose.yml up
#
# WHY THIS IMAGE: it ships mod_audio_fork prebuilt and ABI-matched (no local .so build),
# and the -full tag also bundles mod_lua + mod_curl (needed later for PCI card capture).
# Prefix is /usr/local/freeswitch (source build) — NOT /etc/freeswitch like the old
# safarov image, so conf mounts target /usr/local/freeswitch/conf/**.
#
# ⚠️ FIRST-BOOT VERIFICATION (this image's internal defaults aren't identical to the old
#    safarov setup — check these once against real container logs):
#      1. docker compose up  -> confirm no "Cannot Open Module mod_audio_fork" error.
#      2. docker exec pcfs-freeswitch fs_cli -x 'sofia status'   -> "pipecat" profile up on 5080.
#      3. Loopback audio test (ext 7000), then a real softphone call to ext 5000.
#      4. If RTP has no audio, confirm the range below matches the published ports.
#
# ⚠️ Port clash: the stock cp-freeswitch (docker/freeswitch) binds 5080/8021/RTP too.
#    Stop it first:  docker compose -f docker/freeswitch/docker-compose.yml down
services:
  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:v1.10.1-full   # mod_audio_fork + lua + curl prebuilt
    container_name: pcfs-freeswitch
    restart: unless-stopped
    # The image's entrypoint is `exec freeswitch "$@"`; --rtp-range-* is templated into
    # its own switch.conf, so pin the range to the published ports below via args rather
    # than mounting a read-only switch.conf the entrypoint would fail to sed.
    command: ["freeswitch", "--rtp-range-start", "16384", "--rtp-range-end", "16394"]
    extra_hosts:
      # Docker Desktop overrides host.docker.internal with its own 192.168.65.254 (which
      # doesn't route to the host here), so use a custom name for the host-gateway route
      # that mod_audio_fork connects to (see the dialplan's uuid_audio_fork URL).
      - "bothost:host-gateway"
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5080:5080/udp"               # SIP (pipecat profile)
      - "127.0.0.1:5080:5080/tcp"
      - "127.0.0.1:8021:8021/tcp"               # ESL (fs_cli / future .NET orchestrator)
      - "127.0.0.1:16384-16394:16384-16394/udp" # RTP media (pinned via --rtp-range-* above)
    volumes:
      # Our dialplan context "mrf": answers 5000, starts uuid_audio_fork to the bot.
      - ./freeswitch/conf/dialplan/mrf.xml:/usr/local/freeswitch/conf/dialplan/mrf.xml
      # Our SIP profile (name="pipecat", binds 5080, auth-calls=false, context=mrf).
      # Mounted over the image's own sip_profiles/mrf.xml so only one profile loads and
      # it's the file the entrypoint expects. Our XML uses ext-rtp-ip/ext-sip-ip params
      # (127.0.0.1 hardcoded for host loopback), so the entrypoint's ext-ip sed no-ops.
      - ./freeswitch/conf/sip_profiles/external.xml:/usr/local/freeswitch/conf/sip_profiles/mrf.xml
